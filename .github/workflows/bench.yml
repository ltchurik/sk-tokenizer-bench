name: bench
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 6 1 * *" }]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bench.py
      - uses: actions/upload-artifact@v4
        with: { name: results, path: results/ }
